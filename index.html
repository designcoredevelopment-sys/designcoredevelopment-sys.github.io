<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Core Development</title>
<style>
  :root { --bg: #ffffff; --text: #1d1f24; --muted: #5b6070; --accent: #9a6b00; }

    :root { --bg: #11131a; --text: #e8eaf0; --muted: #a3a8b8; --accent: #e8b84a; }
  }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>

</html>
